name: Build Futbol TV Argentina APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK platform
        run: |
          command -v sdkmanager
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle ]; then
            archive=$(find . -maxdepth 1 -type f -name 'Futbol-TV-Argentina-V1-Source.zip' -print -quit)
            if [ -z "$archive" ]; then
              echo '::error::Source ZIP not found in repository root'
              exit 1
            fi
            unzip -t "$archive" | tail -n 2
            unzip -qo "$archive" -d .
          fi
          test -f app/build.gradle
          test -f settings.gradle
      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-TV-Argentina-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
